name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer event on the same ref supersedes the stale run (PR pushes) instead
# of stacking duplicate test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Guard so a hung step can never burn the org's Actions quota.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync
        run: uv sync --dev

      - name: Test
        run: uv run python -m pytest

      - name: Build
        run: uv run hatch build
